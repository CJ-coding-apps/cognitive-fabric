# Continuous Integration - Run tests and linting
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run Ruff linter
        run: ruff check src tests

      # mypy is deliberately not a gate here yet. It is configured
      # (`strict = true` in pyproject.toml) but the tree does not satisfy it:
      # 199 errors across 39 files as of this commit. A job that fails on every
      # run says less than no job at all, so wire this in once the tree is
      # clean — the configuration is already in place and only the step is
      # missing. The command will be `mypy src`.

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every version, rather than cancelling the others when one fails.
      fail-fast: false
      matrix:
        # 3.13 is claimed in the README ("works everywhere, incl. Python 3.13")
        # and in pyproject's comments, but was never tested.
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[dev]'

      # Tests needing the optional [semantic] stack (LanceDB) skip themselves
      # when it is absent, which is the documented behaviour — they are not
      # silently passing.
      - name: Run tests
        run: pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short

  docker:
    # Builds the image but never publishes it. CF ships a Dockerfile and a
    # docker-compose.yml, and until this job existed nothing had ever built
    # either -- so a broken image would have been found by whoever tried it
    # first, after release, rather than here.
    name: Docker (production image)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --file Dockerfile --tag cognitive-fabric:ci .

      - name: Handshake over stdio
        # Initialise, then let stdin close. The server names itself and its
        # version before it needs a database or a credential, which is the point
        # of checking here: no key, no network, no state.
        #
        # stdout carries the JSON-RPC stream, so anything the server logs has to
        # go to stderr. It does -- PrintLoggerFactory(file=sys.stderr) in
        # utils/logger.py -- and the assertion below fails rather than skips if
        # that ever stops being true.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-handshake","version":"0"}}}' \
            | timeout 300 docker run -i --rm cognitive-fabric:ci \
                > /tmp/handshake.jsonl 2> /tmp/handshake.err \
            || echo "docker run exit: $?"
          echo "--- container stderr (tail) ---"
          tail -20 /tmp/handshake.err || true

      - name: Assert the handshake
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          # Both pinned deliberately: the version this repo publishes, and the
          # name a client sees. Without an explicit `version=` the MCP SDK falls
          # back to the *mcp package's* version, which is how the handshake once
          # advertised 1.30.0 for a 0.1.0 server.
          EXPECTED_VERSION = "0.1.0"
          EXPECTED_NAME = "cognitive_fabric-mcp"

          raw = pathlib.Path("/tmp/handshake.jsonl").read_text()

          # stdout carries the JSON-RPC stream and nothing else. A stray log line
          # here corrupts the protocol, so it fails rather than being skipped.
          messages = []
          for n, line in enumerate(raw.splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  messages.append(json.loads(line))
              except json.JSONDecodeError as e:
                  sys.exit(f"stdout line {n} is not JSON: {line[:160]!r} ({e})")

          infos = [
              m["result"]["serverInfo"]
              for m in messages
              if isinstance(m.get("result"), dict) and "serverInfo" in m["result"]
          ]
          if not infos:
              sys.exit(f"no serverInfo in {len(messages)} message(s): {messages!r}")

          info = infos[0]
          if info.get("name") != EXPECTED_NAME:
              sys.exit(f"serverInfo.name is {info.get('name')!r}, expected {EXPECTED_NAME!r}")
          if info.get("version") != EXPECTED_VERSION:
              sys.exit(
                  f"serverInfo.version is {info.get('version')!r}, "
                  f"expected {EXPECTED_VERSION!r}"
              )

          print(f"stdout: {len(messages)} JSON-RPC message(s), 0 stray lines")
          print(f"serverInfo: {info}")
          PY

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
