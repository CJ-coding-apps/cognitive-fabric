# Continuous Integration - Run tests and linting
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run Ruff linter
        run: ruff check src tests

      # mypy is deliberately not a gate here yet. It is configured
      # (`strict = true` in pyproject.toml) but the tree does not satisfy it:
      # 199 errors across 39 files as of this commit. A job that fails on every
      # run says less than no job at all, so wire this in once the tree is
      # clean — the configuration is already in place and only the step is
      # missing. The command will be `mypy src`.

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Report every version, rather than cancelling the others when one fails.
      fail-fast: false
      matrix:
        # 3.13 is claimed in the README ("works everywhere, incl. Python 3.13")
        # and in pyproject's comments, but was never tested.
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[dev]'

      # Tests needing the optional [semantic] stack (LanceDB) skip themselves
      # when it is absent, which is the documented behaviour — they are not
      # silently passing.
      - name: Run tests
        run: pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
