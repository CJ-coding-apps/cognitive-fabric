[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-fabric"
version = "0.1.0"
description = "Cognitive Fabric: unified Python MCP server for a KuzuDB graph memory bank with symbolic ingestion, semantic search, and distillation"
readme = "README.md"
# The ceiling is Kùzu's, not ours. `kuzu==0.11.3` (pinned below) publishes cp314
# wheels for Linux only -- its macOS and Windows wheels stop at cp313. On 3.14
# those two platforms get no wheel, so pip falls back to the 19 MB sdist and
# tries to compile Kùzu's C++ from source; that usually fails with an error
# naming neither this package nor the reason. Declaring the ceiling turns it
# into one clear line from pip, before anything is downloaded.
#
# Lifting it means Kùzu (or the Kùzu pin) is resolved first. It is recorded with
# the other Kùzu consequences in the project's open decisions; do not widen this
# line on its own.
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Jim Cuttler", email = "jimcuttler@gmail.com" }
]
dependencies = [
    # Pinned exactly: kuzu is archived upstream (0.11.3 is the final release) and
    # its file format is not stable pre-1.0, so an unpinned upgrade can make an
    # existing graph unreadable. Do not widen this without a migration step.
    "kuzu==0.11.3",
    # Pinned < 2: mcp 2.x removed the low-level Server.list_tools/call_tool
    # decorator API this server is built on.
    "mcp>=1.9,<2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "click>=8.1.0",
    # Streamable-HTTP transport (opt-in via `serve --transport http`). These are
    # already pulled in by mcp, but declared explicitly since the server imports
    # them directly.
    "starlette>=0.37",
    "uvicorn>=0.30",
    # Cognitive Fabric: in-process symbolic (AST) ingestion.
    # tree-sitter-language-pack is the maintained, Python 3.13-compatible pack.
    "tree-sitter-language-pack>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/CJ-coding-apps/cognitive-fabric"
Repository = "https://github.com/CJ-coding-apps/cognitive-fabric"
Issues = "https://github.com/CJ-coding-apps/cognitive-fabric/issues"
Changelog = "https://github.com/CJ-coding-apps/cognitive-fabric/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
# Talking to a hosted LLM: the memory optimizer's Dream engine, and the OpenAI
# embedding backend. Optional because this package is local-first -- a purely
# local install (KuzuDB + tree-sitter + local embeddings) should not download two
# vendor SDKs it will never call. Absent, each path fails with the setting or the
# extra to install rather than an ImportError, since both imports are guarded.
#
# Each is capped below the next major. These are the two dependencies whose
# major releases change the request shapes this package builds against: an SDK
# major has removed a parameter the other repo's providers were still passing,
# and the break surfaced as a runtime TypeError on a user's machine rather than
# at install. A cap turns that into a Dependabot PR proposing the lift, which is
# a thing a person reviews. Do not lift without re-running the live-provider
# smoke workflow against the proposed version.
cloud = [
    "openai>=1.0.0,<4",
    "anthropic>=0.20.0,<2",
]
# Vector store only (LanceDB). Enough for semantic search with an injected
# embedder; the OpenAI embedding backend additionally needs the `cloud` extra.
#
# Capped below 0.26, which resolves to 0.25.3 — the version this code is tested
# against, and the same cap docugraph carries. Two reasons, either sufficient:
#
#   * `VectorStore` calls `table_names()`, and lancedb >= 0.30 deprecates it in
#     favour of `list_tables()`. That is not a rename -- the replacement returns
#     a paginated response rather than an iterable of names -- so it is a
#     migration. `filterwarnings` below turns a deprecation raised through our
#     own frame into an error, which is how this surfaced: with an unbounded
#     range CI installed an API this code has never run against, and went red
#     the first time those vector-store tests actually ran.
#   * 0.26 dropped the macOS x86_64 wheels.
#
# So the ceiling is what makes the declared range honest. Lifting it is a
# Dependabot PR a person reviews, the same shape as the `cloud` caps above.
# Do not lift it by widening this line; lift it by migrating to `list_tables()`
# and re-running the vector-store tests.
vectordb = [
    "lancedb>=0.6.0,<0.26",
]
# Recommended local semantic layer: LanceDB + fastembed (pure-ONNX embeddings,
# no torch — works on every Python this package supports).
semantic = [
    "lancedb>=0.6.0,<0.26",
    "fastembed>=0.4.0",
]
# Optional heavier alternative: local embeddings via sentence-transformers
# (requires torch, which has no wheel for some Python versions).
#
# NOT covered by CI: no job installs this extra, so it is the one embedding
# backend with no test behind it. It is kept rather than dropped because
# `sentence-transformers` is a documented value of
# COGNITIVE_FABRIC_FABRIC_EMBEDDING_PROVIDER, and removing the extra would leave
# that setting with no supported install route. Treat any defect found in this
# path as a defect in untested code.
semantic-st = [
    "lancedb>=0.6.0,<0.26",
    "sentence-transformers>=2.6.0",
]

[project.scripts]
cognitive-fabric = "cognitive_fabric.cli.main:cli"
cognitive-fabric-server = "cognitive_fabric.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_fabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fail on DeprecationWarnings originating from our own code (prevents e.g. the
# datetime.utcnow() class of issue from silently returning). Third-party
# deprecations remain warnings so dependency churn doesn't break CI.
filterwarnings = [
    "error::DeprecationWarning:cognitive_fabric",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
